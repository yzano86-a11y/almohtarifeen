workflows:
  android-release:
    name: المحترفين - Android Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      node: lts
      java: 21
      groups:
        - google_play
      # بعد إضافة مفتاح الرفع في Codemagic، أضف مجموعة signing هنا.
      # لا نضع أي أسرار أو مفاتيح داخل GitHub.
    scripts:
      - name: تثبيت حزم المشروع
        script: |
          set -e
          npm install
      - name: بناء نسخة الويب
        script: |
          set -e
          npm run build
      - name: إنشاء ومزامنة Android
        script: |
          set -e
          if [ ! -d "android" ]; then npx cap add android; fi
          npx cap sync android
      - name: ضبط Android 16 و SDK 36
        script: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle')
          s=p.read_text()
          s=s.replace('compileSdkVersion = 35','compileSdkVersion = 36')
          s=s.replace('targetSdkVersion = 35','targetSdkVersion = 36')
          s=s.replace('compileSdk 35','compileSdk 36')
          s=s.replace('targetSdk 35','targetSdk 36')
          p.write_text(s)
          PY
          grep -nE 'compileSdk|targetSdk' android/app/build.gradle || true
      - name: تحديث رقم الإصدار تلقائياً
        script: |
          set -e
          if command -v google-play >/dev/null 2>&1; then
            latest=$(google-play get-latest-build-number --package-name "com.almohtarifeen.tarneeb" 2>/dev/null || true)
            if [ -n "$latest" ] && [ "$latest" -ge 1 ] 2>/dev/null; then
              export NEXT_BUILD_NUMBER=$((latest+1))
            else
              export NEXT_BUILD_NUMBER=1
            fi
          else
            export NEXT_BUILD_NUMBER=1
          fi
          echo "NEXT_BUILD_NUMBER=${NEXT_BUILD_NUMBER}"
      - name: بناء Android Release
        script: |
          set -e
          cd android
          chmod +x gradlew
          ./gradlew clean bundleRelease assembleRelease -PversionCode="${NEXT_BUILD_NUMBER:-1}" --stacktrace
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - $CM_EMAIL
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
