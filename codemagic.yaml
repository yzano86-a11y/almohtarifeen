workflows:
  android-build:
    name: المحترفين - Android APK
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      node: latest

    scripts:
      - name: تثبيت حزم المشروع
        script: |
          set -e
          npm install

      - name: تجهيز TypeScript و Capacitor
        script: |
          set -e
          if [ ! -d "node_modules/typescript" ]; then
            npm install --save-dev typescript
          fi
          if [ ! -d "node_modules/@capacitor/core" ]; then
            npm install @capacitor/core
          fi
          if [ ! -d "node_modules/@capacitor/android" ]; then
            npm install @capacitor/android
          fi

      - name: إنشاء مشروع Android عند الحاجة
        script: |
          set -e
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: بناء نسخة الويب
        script: |
          set -e
          npm run build

      - name: مزامنة Capacitor مع Android
        script: |
          set -e
          npx cap sync android

      - name: تجهيز Android SDK
        script: |
          set -e
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"

      - name: بناء APK تجريبي
        script: |
          set -e
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
      - android/app/build/outputs/**/*.apk
