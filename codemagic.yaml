workflows:
  android-release:
    name: المحترفين - Android APK
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      node: latest

    scripts:
      - name: تثبيت حزم المشروع
        script: |
          set -e
          npm install

      - name: تثبيت أدوات Capacitor
        script: |
          set -e
          npm install --save-dev @capacitor/cli
          npm install @capacitor/core @capacitor/android

      - name: بناء نسخة الويب
        script: |
          set -e
          npm run build

      - name: استخدام إعداد Capacitor JSON
        script: |
          set -e
          rm -f capacitor.config.ts
          test -f capacitor.config.json

      - name: إنشاء منصة Android
        script: |
          set -e
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: مزامنة Capacitor مع Android
        script: |
          set -e
          npx cap sync android

      - name: بناء APK
        script: |
          set -e
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
