workflows:
  android-release:
    name: المحترفين - Android APK
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      node: lts
      java: 21

    scripts:
      - name: تثبيت حزم المشروع
        script: |
          set -e
          npm install

      - name: تثبيت Capacitor 7 المتوافق
        script: |
          set -e
          npm install --save-dev @capacitor/cli@7.4.3
          npm install @capacitor/core@7.4.3 @capacitor/android@7.4.3

      - name: بناء نسخة الويب
        script: |
          set -e
          npm run build

      - name: التحقق من إعداد Capacitor JSON
        script: |
          set -e
          rm -f capacitor.config.ts
          test -f capacitor.config.json

      - name: إنشاء منصة Android
        script: |
          set -e
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: مزامنة Capacitor مع Android
        script: |
          set -e
          npx cap sync android

      - name: تنظيف وبناء APK
        script: |
          set -e
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
