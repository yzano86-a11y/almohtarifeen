workflows:
  android-release:
    name: المحترفين - Android Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      node: lts
      java: 21
      groups:
        - google_play
    scripts:
      - name: تثبيت حزم المشروع
        script: |
          set -e
          npm install
      - name: بناء نسخة الويب
        script: |
          set -e
          npm run build
      - name: إنشاء ومزامنة Android
        script: |
          set -e
          if [ ! -d "android" ]; then npx cap add android; fi
          npx cap sync android
      - name: بناء Android Release
        script: |
          set -e
          cd android
          chmod +x gradlew
          ./gradlew clean bundleRelease assembleRelease --stacktrace
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - $CM_EMAIL
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
