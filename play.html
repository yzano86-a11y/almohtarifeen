<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07101d">
<title>المحترفين — تشغيل اللعبة</title>
<style>html,body{margin:0;width:100%;height:100%;background:#05030b;overflow:hidden}iframe{display:block;border:0;width:100%;height:100%;background:#05030b}</style>
</head>
<body>
<iframe id="appFrame" src="./index.html?runtime=play-v1" title="المحترفين"></iframe>
<script>
(function(){
  const frame=document.getElementById('appFrame');
  let started=false;
  function start(){
    if(started)return;
    started=true;
    try{
      const w=frame.contentWindow,d=frame.contentDocument;
      const run=async()=>{
        try{
          if(typeof w.guestPlay!=='function'){
            await new Promise((resolve,reject)=>{
              const s=d.createElement('script');
              s.type='module';
              s.src='./app.js?runtime=play-v1';
              s.onload=resolve;
              s.onerror=()=>reject(new Error('تعذر تحميل app.js'));
              d.body.appendChild(s);
            });
          }
          if(typeof w.guestPlay!=='function')throw new Error('مشغّل اللعبة غير متاح');
          await w.guestPlay();
        }catch(e){
          console.error('play.html launcher failed',e);
          const state=d.getElementById('stateInfo');
          if(state)state.textContent=e.message||'تعذر فتح طاولة طرنيب';
        }
      };
      run();
    }catch(e){console.error(e)}
  }
  frame.addEventListener('load',start,{once:true});
})();
</script>
</body>
</html>
