<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d1422"><title>المحترفين في الطرنيب — طاولة محبوسة</title><style>:root{--bg:#0b1220;--panel:#17243a;--gold:#ffd166;--blue:#4f8cff;--text:#f7f9fc;--muted:#aab7ca;--felt:#14543d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1b2c48,#0b1220 60%);color:var(--text);font-family:Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;gap:8px;align-items:center}.card{background:#17243af5;border:1px solid #2b3d5b;border-radius:18px;padding:14px;margin:10px 0}.muted{color:var(--muted)}button{border:0;border-radius:11px;padding:11px 14px;background:var(--blue);color:#fff;font-weight:700;font:inherit;margin:3px}button:disabled{opacity:.4}.gold{background:#a67c16}.secondary{background:#34455f}.board{background:linear-gradient(90deg,#0e432f,#1a6248,#0e432f);border:10px solid #70491f;border-radius:18px;padding:10px;display:grid;grid-template-columns:repeat(12,1fr);gap:5px;min-height:360px;direction:ltr;box-shadow:inset 0 0 35px #0008}.pt{position:relative;min-height:155px;background:linear-gradient(180deg,#d5b06c 0 3%,transparent 3%);border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:4px}.pt:nth-child(n+13){justify-content:flex-start;background:linear-gradient(0deg,#d5b06c 0 3%,transparent 3%)}.num{position:absolute;top:4px;font-size:10px;color:#fff8}.pt:nth-child(n+13) .num{top:auto;bottom:4px}.checkers{display:flex;flex-direction:column-reverse;align-items:center;gap:2px}.pt:nth-child(n+13) .checkers{flex-direction:column}.checker{width:25px;height:25px;border-radius:50%;border:2px solid #fff8;box-shadow:0 2px 5px #0008;cursor:pointer}.white{background:#eee}.black{background:#222}.selected{outline:3px solid var(--gold);transform:scale(1.08)}.blocked{box-shadow:0 0 0 2px #e85d5d inset}.bar{display:flex;justify-content:center;gap:6px;padding:8px;min-height:35px}.dice{display:flex;justify-content:center;gap:12px;font-size:30px}.die{background:#fff;color:#111;border-radius:10px;padding:5px 12px;min-width:45px;text-align:center;box-shadow:0 4px 8px #0004}.actions{text-align:center}.status{text-align:center;font-weight:700;color:var(--gold);min-height:24px}.scores{display:grid;grid-template-columns:1fr 1fr;gap:8px}.score{background:#20314b;padding:9px;border-radius:12px;text-align:center}@media(max-width:560px){.board{gap:2px;padding:5px;border-width:6px;min-height:280px}.pt{min-height:125px}.checker{width:19px;height:19px}.num{font-size:8px}}</style></head><body><div class="wrap"><div class="card top"><div><h2 style="margin:0">🎲 طاولة محبوسة</h2><div class="muted">المحترفين في الطرنيب</div></div><button class="secondary" onclick="location.href='index.html'">العودة</button></div><div class="card"><div class="scores"><div class="score">أنت<br><b id="you">0</b></div><div class="score">الخصم<br><b id="ai">0</b></div></div><div class="status" id="status"></div><div class="dice"><div class="die" id="d1">—</div><div class="die" id="d2">—</div></div><div class="actions"><button id="roll" onclick="rollDice()">🎲 رمي النرد</button><button class="gold" onclick="newGame()">لعبة جديدة</button></div></div><div class="card"><div class="board" id="board"></div><div class="bar" id="bar"></div></div><div class="card muted">القواعد: لكل لاعب 15 حجرًا. لا يوجد ضرب؛ بدلًا منه يتم حبس الحجر المنفرد. الحجر المحبوس لا يتحرك حتى يُزال الحابس. حبس آخر حجر في نقطة البداية قبل خروجه يحسم اللعبة وفق قواعد المحبوسة. </div></div><script>const N=24;let b,turn=0,dice=[],selected=null,movesLeft=[],score=[0,0],gameOver=false;function init(){b=Array.from({length:N},()=>[]);for(let i=0;i<15;i++){b[0].push(0);b[23].push(1)}turn=0;dice=[];selected=null;gameOver=false;setStatus('أنت تبدأ. ارمِ النرد.');render()}function setStatus(t){document.getElementById('status').textContent=t}function render(){let el=document.getElementById('board');el.innerHTML='';for(let i=0;i<N;i++){let p=document.createElement('div');p.className='pt';p.dataset.i=i;p.onclick=()=>pointClick(i);let num=document.createElement('span');num.className='num';num.textContent=i+1;p.appendChild(num);let cs=document.createElement('div');cs.className='checkers';b[i].forEach((c,j)=>{let x=document.createElement('div');x.className='checker '+(c===0?'white':'black');if(selected&&selected.i===i&&selected.j===j)x.classList.add('selected');if(isPinned(i,j))x.classList.add('blocked');x.onclick=e=>{e.stopPropagation();selectChecker(i,j)};cs.appendChild(x)});p.appendChild(cs);el.appendChild(p)}document.getElementById('d1').textContent=dice[0]||'—';document.getElementById('d2').textContent=dice[1]||'—';document.getElementById('you').textContent=score[0];document.getElementById('ai').textContent=score[1];document.getElementById('roll').disabled=turn!==0||dice.length>0||gameOver}function isPinned(i,j){let c=b[i][j];if(c===undefined)return false;return b[i].length===2&&b[i][0]!==c&&b[i][1]===c&&j===0}function rollDice(){if(turn!==0||gameOver)return;dice=[1+Math.floor(Math.random()*6),1+Math.floor(Math.random()*6)];movesLeft=dice[0]===dice[1]?[dice[0],dice[0],dice[0],dice[0]]:[dice[0],dice[1]];selected=null;setStatus('اختر حجرًا ثم نقطة الوصول.');render();if(!hasAnyMove(0)){setStatus('لا توجد حركة قانونية. ينتهي دورك.');setTimeout(()=>endTurn(),700)}}function direction(c){return c===0?1:-1}function canMove(from,to,c,steps){if(to<0||to>=N)return false;if(b[from].length===0||b[from][b[from].length-1]!==c)return false;if(isPinned(from,b[from].length-1))return false;let dir=direction(c),dist=(to-from)*dir;if(dist!==steps)return false;let dest=b[to];if(dest.length>=2&&dest[0]!==c)return false;for(let s=1;s<=steps;s++){let mid=from+dir*s;if(mid<0||mid>=N)return false;if(s<steps&&b[mid].length>=2&&b[mid][0]!==c)return false}return true}function legalDestinations(i,c){let out=[];for(let n of movesLeft){let to=i+direction(c)*n;if(canMove(i,to,c,n))out.push({to,n})}return out}function hasAnyMove(c){for(let i=0;i<N;i++)if(b[i].length&&b[i][b[i].length-1]===c&&!isPinned(i,b[i].length-1)&&legalDestinations(i,c).length)return true;return false}function selectChecker(i,j){if(turn!==0||!movesLeft.length||gameOver)return;let c=b[i][j];if(c!==0)return;if(j!==b[i].length-1||isPinned(i,j)){setStatus('هذا الحجر محبوس أو ليس في أعلى المجموعة.');return}if(!legalDestinations(i,0).length){setStatus('لا توجد حركة بهذا الحجر.');return}selected={i,j};setStatus('اختر نقطة الوصول.');render()}function pointClick(to){if(!selected||turn!==0||gameOver)return;let opts=legalDestinations(selected.i,0),opt=opts.find(x=>x.to===to);if(!opt){setStatus('هذه الحركة غير قانونية.');return}move(selected.i,to,0,opt.n);selected=null;if(checkWin(0))return;if(movesLeft.length) {setStatus('اختر الحركة التالية.');render()} else endTurn()}function move(from,to,c,n){let idx=b[from].lastIndexOf(c);b[from].splice(idx,1);b[to].push(c);let k=movesLeft.indexOf(n);if(k>=0)movesLeft.splice(k,1)}function endTurn(){dice=[];movesLeft=[];selected=null;turn=1;render();setStatus('دور الخصم...');setTimeout(aiTurn,600)}function aiTurn(){if(gameOver)return;let d1=1+Math.floor(Math.random()*6),d2=1+Math.floor(Math.random()*6);movesLeft=d1===d2?[d1,d1,d1,d1]:[d1,d2];dice=[d1,d2];while(movesLeft.length){let choice=bestAiMove();if(!choice)break;move(choice.from,choice.to,1,choice.n)}render();if(checkWin(1))return;dice=[];movesLeft=[];turn=0;setStatus('دورك. ارمِ النرد.');render()}function bestAiMove(){let best=null;for(let i=0;i<N;i++){if(!b[i].length||b[i][b[i].length-1]!==1||isPinned(i,b[i].length-1))continue;for(let n of movesLeft){let to=i- n;if(canMove(i,to,1,n)){let val=to<6?5:0;if(b[to].length===1&&b[to][0]===0)val+=8;if(to===0)val+=2;if(!best||val>best.val)best={from:i,to,n,val}}}}return best}function checkWin(c){if(b[c===0?23:0].some(x=>x===c))return false;let home=c===0?[18,19,20,21,22,23]:[0,1,2,3,4,5];let total=b.reduce((a,p)=>a+p.filter(x=>x===c).length,0);if(total===0)return true;return false}function newGame(){init()}init();</script></body></html>
