<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d1422"><title>المحترفين في الطرنيب</title><style>:root{--bg:#0d1422;--card:#172338;--accent:#4f8cff;--gold:#ffd166;--text:#f5f7fb;--muted:#aab7ca}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#182944,#0d1422 55%);color:var(--text);font-family:Arial,sans-serif;min-height:100vh}.wrap{max-width:700px;margin:auto;padding:16px}.card{background:rgba(23,35,56,.98);border:1px solid #2a3b58;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 12px 35px #0004}h1,h2,h3{margin:5px 0 12px}.muted{color:var(--muted)}button,input{width:100%;padding:13px;margin:6px 0;border-radius:12px;border:0;font:inherit}input{background:#273752;color:#fff}button{background:var(--accent);color:#fff;font-weight:700;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.secondary{background:#34445f}.gold{background:#a57e16}.row{display:flex;gap:8px}.row>*{flex:1}.hidden{display:none!important}.hero{text-align:center;padding:30px 18px}.hero .logo{font-size:54px}.hero h1{font-size:31px}.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}.quick button{margin:0}.seat{padding:11px;border:1px solid #354867;border-radius:12px;margin:7px 0;display:flex;justify-content:space-between}.badge{padding:3px 8px;border-radius:99px;background:#2b3b57;font-size:12px}.board{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#202f49;border-radius:12px;padding:10px;text-align:center}.notice{border:1px solid #3c4f6d;border-radius:12px;padding:10px;margin:8px 0}.cards{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}.cardplay{width:54px;height:76px;margin:0;background:#fff;color:#111}.red{color:#c62828}.trick{min-height:115px;background:#101b2d;border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;justify-content:center;gap:8px}.played{background:#fff;color:#111;width:68px;height:82px;border-radius:12px;padding:7px;text-align:center;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.log{max-height:170px;overflow:auto;background:#101b2d;padding:10px;border-radius:12px;font-size:13px}.msg{min-height:24px;color:var(--gold);padding:4px}</style></head><body><div class="wrap"><section id="landing" class="card hero"><div class="logo">🎴</div><h1>المحترفين في الطرنيب</h1><p class="muted">52 ورقة · 4 لاعبين · 13 ورقة لكل لاعب · 13 أكلة</p><button onclick="guestPlay()">🎮 دخول تجريبي — العب الآن</button><div class="quick"><button onclick="openLogin()">🔐 تسجيل الدخول</button><button class="secondary" onclick="openSignup()">📝 إنشاء حساب</button></div><p class="muted">يمكنك اللعب مباشرة بدون تسجيل.</p></section><section id="auth" class="card hidden"><h2 id="authTitle">تسجيل الدخول</h2><input id="email" type="email" placeholder="البريد الإلكتروني"><input id="password" type="password" placeholder="كلمة المرور"><div class="row"><button onclick="submitAuth()" id="authSubmit">دخول</button><button class="secondary" onclick="backLanding()">رجوع</button></div><div id="authMsg" class="msg"></div></section><section id="home" class="card hidden"><h2>🎴 غرفة اللعب</h2><button onclick="createRoom()">إنشاء غرفة طرنيب</button><input id="roomCode" maxlength="6" placeholder="رمز الغرفة"><button class="secondary" onclick="joinRoom()">انضمام إلى غرفة</button><button class="gold" onclick="guestPlay()">🎮 لعب تجريبي ضد AI</button><button class="secondary" onclick="signOut()">خروج</button></section><section id="room" class="card hidden"><h2>غرفة الطرنيب <span id="code" class="badge"></span></h2><p id="roomStatus" class="muted"></p><div id="players"></div><div class="row"><button id="startBtn" onclick="startRoomGame()" disabled>بدء اللعبة</button><button class="secondary" onclick="leaveRoom()">العودة</button></div></section><section id="game" class="card hidden"><div class="row"><div><h2>🎴 المحترفين في الطرنيب</h2><div id="roundLabel" class="muted"></div></div><button class="secondary" onclick="backHome()">خروج</button></div><div class="board"><div class="stat">فريق 1<br><b id="score0">0</b></div><div class="stat">فريق 2<br><b id="score1">0</b></div></div><div id="stateInfo" class="notice"></div><div id="trick" class="trick"></div><section id="bidBox" class="card hidden"><h3>المزايدة</h3><p id="bidInfo" class="muted"></p><div id="bids" class="grid"></div></section><section id="trumpBox" class="card hidden"><h3>اختيار الحكم</h3><div id="trumps" class="grid"></div></section><h3>أوراقك — 13 ورقة</h3><div id="hand" class="cards"></div><div id="log" class="log"></div></section><div id="msg" class="msg"></div></div><script type="module">import{createClient}from"https://esm.sh/@supabase/supabase-js@2";import{SUITS,dealHands,newState,applyBid,setTrump,legalCards,applyCard}from"./games/tarneeb/engine.js";const supabase=createClient("https://gzgngkywjyanxicmwxlc.supabase.co","sb_publishable_Jyr7D3mH7WRXfG5V1v7gcw_I3QhtL3j");const $=id=>document.getElementById(id),red=s=>s==='♥'||s==='♦';let authMode='login',G=null,currentRoom=null,channel=null,aiTimer=null;function show(id,on){$(id).classList.toggle('hidden',!on)}function msg(t){$('msg').textContent=t||''}function openLogin(){authMode='login';$('authTitle').textContent='تسجيل الدخول';$('authSubmit').textContent='دخول';show('landing',false);show('auth',true)}function openSignup(){authMode='signup';$('authTitle').textContent='إنشاء حساب';$('authSubmit').textContent='إنشاء الحساب';show('landing',false);show('auth',true)}function backLanding(){show('auth',false);show('landing',true)}window.openLogin=openLogin;window.openSignup=openSignup;window.backLanding=backLanding;window.guestPlay=()=>{show('landing',false);show('home',false);startGame(true)};window.submitAuth=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return $('authMsg').textContent='أدخل البريد وكلمة المرور.';const r=authMode==='login'?await supabase.auth.signInWithPassword({email,password}):await supabase.auth.signUp({email,password});if(r.error)return $('authMsg').textContent=r.error.message;show('auth',false);show('home',true)};window.signOut=async()=>{await supabase.auth.signOut();show('home',false);show('landing',true)};async function createRoom(){const{data,error}=await supabase.rpc('tarneeb_create_game');if(error)return msg(error.message);const code=typeof data==='string'?data:data?.room_code;if(!code)return msg('تعذر إنشاء الغرفة');const r=await supabase.from('tarneeb_games').select('id,room_code,status').eq('room_code',code).single();if(r.error)return msg(r.error.message);showRoom(r.data.id,r.data.room_code)}window.createRoom=createRoom;window.joinRoom=async()=>{const code=$('roomCode').value.trim().toUpperCase();if(!code)return msg('أدخل رمز الغرفة');const{data,error}=await supabase.rpc('join_tarneeb_room',{p_room_code:code});if(error)return msg(error.message);showRoom(data.room_id,data.room_code)};async function showRoom(id,code){currentRoom=id;$('code').textContent=code;show('home',false);show('room',true);await loadPlayers();if(channel)await supabase.removeChannel(channel);channel=supabase.channel('room-'+id).on('postgres_changes',{event:'*',schema:'public',table:'tarneeb_room_players',filter:'room_id=eq.'+id},loadPlayers).subscribe()}async function loadPlayers(){if(!currentRoom)return;const{data,error}=await supabase.from('tarneeb_room_players').select('seat,user_id').eq('room_id',currentRoom).order('seat');if(error)return msg(error.message);$('players').innerHTML='';for(let i=1;i<=4;i++){const p=(data||[]).find(x=>x.seat===i),d=document.createElement('div');d.className='seat';d.innerHTML=`<span>المقعد ${i} — الفريق ${i%2?1:2}</span><span class="badge">${p?'متصل':'فارغ'}</span>`;$('players').appendChild(d)}$('roomStatus').textContent=`اللاعبون: ${(data||[]).length}/4`;$('startBtn').disabled=(data||[]).length<4}window.leaveRoom=async()=>{if(channel)await supabase.removeChannel(channel);currentRoom=null;show('room',false);show('home',true)};window.startRoomGame=()=>startGame(false);function startGame(demo){if(aiTimer)clearTimeout(aiTimer);G={demo,round:1,score:[0,0],state:newState(dealHands(),0,[0,0]),log:['تم توزيع 52 ورقة: 13 ورقة لكل لاعب.']};show('home',false);show('room',false);show('game',true);render();runAI()}function render(){$('score0').textContent=G.score[0];$('score1').textContent=G.score[1];const s=G.state;$('roundLabel').textContent=`الجولة ${G.round} · الأكلة ${s.trickNo}/13`;$('stateInfo').textContent=s.phase==='bid'?`المزايدة: دور اللاعب ${s.bidTurn+1} · أعلى طلب ${s.highBid<7?'—':s.highBid}`:s.phase==='trump'?`اللاعب ${s.bidWinner+1} اختار الطلب ${s.highBid} — اختر الحكم`:s.phase==='play'?`الحكم: ${s.trump} · الدور: اللاعب ${s.turn+1}`:`انتهت الجولة · الفريق ${s.roundResult.team+1} أخذ ${s.roundResult.made} أكلة`;$('bidBox').classList.toggle('hidden',!(s.phase==='bid'&&s.bidTurn===0));$('trumpBox').classList.toggle('hidden',!(s.phase==='trump'&&s.bidWinner===0));$('bidInfo').textContent=`دورك في المزايدة · أعلى طلب ${s.highBid<7?'لا يوجد':s.highBid}`;$('bids').innerHTML=[7,8,9,10,11,12,13].map(n=>`<button ${n<=s.highBid?'disabled':''} onclick="bid(${n})">${n}</button>`).join('');$('trumps').innerHTML=SUITS.map(x=>`<button onclick="chooseTrump('${x}')">${x}</button>`).join('');$('trick').innerHTML=s.trick.map(x=>`<div class="played">لاعب ${x.player+1}<br><span class="${red(x.card.s)?'red':''}">${x.card.r+x.card.s}</span></div>`).join('');const legal=s.phase==='play'&&s.turn===0?legalCards(s,0):[];$('hand').innerHTML=s.players[0].hand.map((c,i)=>{const ok=legal.some(x=>x.s===c.s&&x.r===c.r);return `<button class="cardplay ${red(c.s)?'red':''}" ${ok?'':'disabled'} onclick="playHuman(${i})">${c.r+c.s}</button>`}).join('');$('log').innerHTML=G.log.slice(-14).map(x=>'• '+x).join('<br>')}window.bid=n=>{try{G.state=applyBid(G.state,0,n);G.log.push(`أنت زايدت ${n}.`);render();runAI()}catch(e){msg(e.message)}};window.chooseTrump=t=>{try{G.state=setTrump(G.state,0,t);G.log.push(`اخترت الحكم ${t}.`);render();runAI()}catch(e){msg(e.message)}};window.playHuman=i=>{const c=G.state.players[0].hand[i];try{G.state=applyCard(G.state,0,c);G.log.push(`لعبت ${c.r}${c.s}.`);afterMove()}catch(e){msg(e.message)}};function aiBid(){const s=G.state,p=s.bidTurn,h=s.players[p].hand,high=h.filter(c=>c.v>=11).length,proposal=Math.min(13,Math.max(7,7+Math.floor(high/2)));return proposal<=s.highBid?null:proposal}function runAI(){if(!G||!G.demo)return;if(aiTimer)clearTimeout(aiTimer);const s=G.state;if(s.phase==='round_end'){afterMove();return}if(s.phase==='bid'&&s.bidTurn!==0){aiTimer=setTimeout(()=>{try{const p=s.bidTurn,b=aiBid();G.state=applyBid(G.state,p,b);G.log.push(b?`اللاعب ${p+1} زايد ${b}.`:`اللاعب ${p+1} مرّر.`);render();runAI()}catch(e){msg(e.message)}},250);return}if(s.phase==='trump'&&s.bidWinner!==0){aiTimer=setTimeout(()=>{const p=s.bidWinner,h=s.players[p].hand,count=Object.fromEntries(SUITS.map(x=>[x,0]));h.forEach(c=>count[c.s]++);const t=SUITS.reduce((best,x)=>count[x]>count[best]?x:best,SUITS[0]);G.state=setTrump(G.state,p,t);G.log.push(`اللاعب ${p+1} اختار الحكم ${t}.`);render();runAI()},250);return}if(s.phase==='play'&&s.turn!==0){aiTimer=setTimeout(()=>{try{const p=s.turn,legal=legalCards(s,p);if(!legal.length)throw new Error('لا توجد ورقة قانونية للـAI');let c=legal.slice().sort((a,b)=>b.v-a.v)[0];if(s.leadSuit){const tr=legal.filter(x=>x.s===s.trump);c=(tr.length?tr:legal).slice().sort((a,b)=>b.v-a.v)[0]}G.state=applyCard(G.state,p,c);G.log.push(`اللاعب ${p+1} لعب ${c.r}${c.s}.`);afterMove()}catch(e){msg(e.message)}},250)}}function afterMove(){render();if(G.state.phase==='round_end'){G.score=G.state.roundResult.scores;G.log.push(`نتيجة الجولة: ${G.score[0]} - ${G.score[1]}.`);render();if(Math.max(...G.score)>=31){G.log.push('🏆 انتهت المباراة!');render();return}setTimeout(()=>{G.round++;G.state=newState(dealHands(),(G.round-1)%4,G.score);G.log.push('جولة جديدة — تم توزيع 52 ورقة.');render();runAI()},1200)}else runAI()}async function backHome(){if(aiTimer)clearTimeout(aiTimer);G=null;show('game',false);if(currentRoom)show('room',true);else{const{data:{session}}=await supabase.auth.getSession();show(session?'home':'landing',true)}}window.backHome=backHome;</script></body></html>
