<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d1422"><title>المحترفين — طرنيب</title><style>:root{--bg:#0d1422;--card:#172338;--accent:#4f8cff;--gold:#ffd166;--text:#f5f7fb;--muted:#aab7ca}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#182944,#0d1422 55%);color:var(--text);font-family:Arial,sans-serif;min-height:100vh}.wrap{max-width:620px;margin:auto;padding:18px}.card{background:rgba(23,35,56,.97);border:1px solid #2a3b58;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 12px 35px #0004}h1,h2,h3{margin:5px 0 12px}.muted{color:var(--muted)}button,input{width:100%;padding:14px;margin:6px 0;border-radius:12px;border:0;font:inherit}input{background:#273752;color:#fff}button{background:var(--accent);color:#fff;font-weight:700}button.secondary{background:#34445f}button.gold{background:#a57e16}.row{display:flex;gap:8px}.row>*{flex:1}.hidden{display:none!important}.msg{min-height:24px;color:var(--gold);padding:4px}.hero{text-align:center;padding:28px 18px}.hero .logo{font-size:54px}.hero h1{font-size:32px}.hero .tag{font-size:16px;margin-bottom:20px}.guest{font-size:18px;padding:16px}.loginBox{margin-top:14px}.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}.quick button{margin:0}.seat{padding:11px;border:1px solid #354867;border-radius:12px;margin:7px 0;display:flex;justify-content:space-between}.badge{padding:3px 8px;border-radius:99px;background:#2b3b57;font-size:12px}.board{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#202f49;border-radius:12px;padding:10px;text-align:center}.cards{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}.cardplay{width:54px;height:76px;margin:0;background:#fff;color:#111}.cardplay.red{color:#c62828}.trick{min-height:120px;background:#101b2d;border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;justify-content:center;gap:8px}.played{background:#fff;color:#111;width:65px;height:82px;border-radius:12px;padding:7px;text-align:center;font-weight:bold}.bidgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.log{max-height:150px;overflow:auto;background:#101b2d;padding:10px;border-radius:12px;font-size:13px}</style></head><body><div class="wrap">
<section id="landing" class="card hero"><div class="logo">🎴</div><h1>المحترفين</h1><p class="tag muted">طرنيب — العب فوراً، وسجّل فقط عندما تريد.</p><button class="guest" onclick="guestPlay()">🎮 دخول تجريبي — العب الآن</button><div class="quick"><button onclick="openLogin()">🔐 تسجيل الدخول</button><button class="secondary" onclick="openSignup()">📝 إنشاء حساب</button></div><p class="muted">لا يحتاج الدخول التجريبي إلى بريد إلكتروني أو كلمة مرور.</p></section>
<section id="authBox" class="card hidden"><h2 id="authTitle">تسجيل الدخول</h2><p class="muted" id="authHint">ادخل إلى حسابك للعب أونلاين وحفظ تقدمك.</p><input id="email" type="email" placeholder="البريد الإلكتروني"><input id="password" type="password" placeholder="كلمة المرور"><div class="row"><button onclick="submitAuth()" id="authSubmit">دخول</button><button class="secondary" onclick="backLanding()">رجوع</button></div><div class="msg" id="authMsg"></div></section>
<section id="home" class="card hidden"><h2>أهلًا بك 👋</h2><p class="muted">اختر طريقة اللعب</p><button onclick="createRoom()">إنشاء غرفة طرنيب</button><input id="roomCode" maxlength="6" placeholder="رمز الغرفة"><button class="secondary" onclick="joinRoom()">انضمام إلى غرفة</button><button class="gold" onclick="startDemo()">🎮 تجربة ضد 3 لاعبين آليين</button><button class="secondary" onclick="signOut()">خروج</button></section>
<section id="room" class="card hidden"><h2>غرفة الطرنيب <span class="badge" id="code"></span></h2><p id="roomStatus" class="muted"></p><div id="players"></div><div class="row"><button id="startBtn" onclick="startRoomGame()" disabled>بدء اللعبة</button><button class="secondary" onclick="leaveRoom()">العودة</button></div></section>
<section id="game" class="card hidden"><div class="row"><div><h2>🎴 طرنيب</h2><div class="muted" id="roundLabel"></div></div><button class="secondary" onclick="backHome()">خروج</button></div><div class="board"><div class="stat">فريق 1<br><b id="score0">0</b></div><div class="stat">فريق 2<br><b id="score1">0</b></div></div><div class="stat" style="margin-top:8px">الحكم: <b id="trump">—</b> · الدور: <b id="turn">—</b></div><h3>الأكلة الحالية</h3><div id="trick" class="trick"></div><div id="bidBox" class="card hidden"><h3>المزايدة</h3><p id="bidInfo" class="muted"></p><div id="bids" class="bidgrid"></div></div><h3>أوراقك</h3><div id="hand" class="cards"></div><div class="log" id="log"></div></section><div id="msg" class="msg"></div></div>
<script type="module">import{createClient}from"https://esm.sh/@supabase/supabase-js@2";const supabase=createClient("https://gzgngkywjyanxicmwxlc.supabase.co","sb_publishable_Jyr7D3mH7WRXfG5V1v7gcw_I3QhtL3j");const $=id=>document.getElementById(id);let authMode="login",G=null,currentRoom=null,channel=null;const suits=["♠","♥","♦","♣"],ranks=["7","8","9","10","J","Q","K","A"],red=s=>s==="♥"||s==="♦";function show(id,on){$(id).classList.toggle("hidden",!on)}function message(t){$("msg").textContent=t}function openLogin(){authMode="login";$("authTitle").textContent="تسجيل الدخول";$("authHint").textContent="ادخل إلى حسابك للعب أونلاين وحفظ تقدمك.";$("authSubmit").textContent="دخول";show("landing",false);show("authBox",true)}function openSignup(){authMode="signup";$("authTitle").textContent="إنشاء حساب";$("authHint").textContent="أنشئ حسابك لحفظ تقدمك والتواصل واللعب أونلاين.";$("authSubmit").textContent="إنشاء الحساب";show("landing",false);show("authBox",true)}function backLanding(){show("authBox",false);show("landing",true)}window.openLogin=openLogin;window.openSignup=openSignup;window.backLanding=backLanding;window.guestPlay=()=>{show("landing",false);startGame(true)};window.submitAuth=async()=>{let email=$("email").value.trim(),password=$("password").value;if(!email||!password){$("authMsg").textContent="أدخل البريد الإلكتروني وكلمة المرور.";return}let r=authMode==="login"?await supabase.auth.signInWithPassword({email,password}):await supabase.auth.signUp({email,password});if(r.error){$("authMsg").textContent=r.error.message;return}$("authMsg").textContent=authMode==="login"?"تم الدخول بنجاح.":"تم إنشاء الحساب. يمكنك الآن الدخول.";if(authMode==="login")showHome()};window.signOut=async()=>{await supabase.auth.signOut();show("home",false);show("landing",true)};async function showHome(){show("landing",false);show("authBox",false);show("home",true)}async function createRoom(){let{data,error}=await supabase.rpc("tarneeb_create_game");if(error){message(error.message);return}let code=typeof data==="string"?data:data?.room_code;if(!code){message("تعذر إنشاء الغرفة");return}let r=await supabase.from("tarneeb_games").select("id,room_code,status").eq("room_code",code).single();if(r.error){message(r.error.message);return}await showRoom(r.data.id,r.data.room_code)}window.createRoom=createRoom;window.joinRoom=async()=>{let code=$("roomCode").value.trim().toUpperCase();if(!code)return message("أدخل رمز الغرفة");let{data,error}=await supabase.rpc("join_tarneeb_room",{p_room_code:code});if(error){message(error.message);return}showRoom(data.room_id,data.room_code)};async function showRoom(id,code){currentRoom=id;$("code").textContent=code;show("home",false);show("room",true);await loadPlayers();if(channel)await supabase.removeChannel(channel);channel=supabase.channel("room-"+id).on("postgres_changes",{event:"*",schema:"public",table:"tarneeb_room_players",filter:"room_id=eq."+id},loadPlayers).subscribe()}async function loadPlayers(){if(!currentRoom)return;let{data,error}=await supabase.from("tarneeb_room_players").select("seat,user_id").eq("room_id",currentRoom).order("seat");if(error)return message(error.message);$("players").innerHTML="";for(let i=1;i<=4;i++){let p=(data||[]).find(x=>x.seat===i),d=document.createElement("div");d.className="seat";d.innerHTML=`<span>المقعد ${i} — الفريق ${i%2?1:2}</span><span class="badge">${p?"متصل":"فارغ"}</span>`;$("players").appendChild(d)}$("roomStatus").textContent=`اللاعبون: ${(data||[]).length}/4`;$("startBtn").disabled=(data||[]).length<4}window.leaveRoom=async()=>{if(channel)await supabase.removeChannel(channel);currentRoom=null;show("room",false);showHome()};window.startRoomGame=()=>startGame(false);window.startDemo=()=>startGame(true);function makeDeck(){let d=[];for(let s of suits)for(let r of ranks)d.push({s,r,v:r==="A"?14:r==="K"?13:r==="Q"?12:r==="J"?11:+r});return d}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function startGame(demo){G={demo,players:[0,1,2,3].map(i=>({team:i%2,hand:[],tricks:0})),scores:[0,0],round:1,phase:"bid",bids:[null,null,null,null],bidTurn:0,current:0,trump:null,lead:null,trick:[],trickNo:0,log:[]};show("home",false);show("room",false);show("game",true);deal();render();aiLoop()}function deal(){let d=shuffle(makeDeck());G.players.forEach(p=>{p.hand=[];p.tricks=0});d.forEach((c,i)=>G.players[i%4].hand.push(c));G.players.forEach(p=>p.hand.sort((a,b)=>suits.indexOf(a.s)-suits.indexOf(b.s)||b.v-a.v));G.phase="bid";G.bidTurn=0;G.bids=[null,null,null,null];G.trick=[];G.trickNo=0;G.trump=null;G.lead=null;G.log=["تم توزيع 13 ورقة."]}function bestBid(p){return Math.min(13,Math.max(7,6+Math.floor(p.hand.filter(c=>c.v>=13).length*.75)))}function chooseTrump(p){let c={};suits.forEach(s=>c[s]=0);p.hand.forEach(x=>c[x.s]++);return suits.sort((a,b)=>c[b]-c[a])[0]}function legal(c){if(!G.lead)return true;let has=G.players[G.current].hand.some(x=>x.s===G.lead);return !has||c.s===G.lead}function render(){$("score0").textContent=G.scores[0];$("score1").textContent=G.scores[1];$("roundLabel").textContent=`الجولة ${G.round} · الأكلة ${G.trickNo}/13`;$('trump').textContent=G.trump||"—";$('turn').textContent=`اللاعب ${G.current+1}`;show('bidBox',G.phase==='bid');$('trick').innerHTML=G.trick.map(x=>`<div class="played">لاعب ${x.p+1}<br><span class="${red(x.c.s)?'red':''}">${x.c.r+x.c.s}</span></div>`).join('');$('hand').innerHTML=G.players[0].hand.map((c,i)=>`<button class="cardplay ${red(c.s)?'red':''}" ${G.phase!=='play'||G.current!==0||!legal(c)?'disabled':''} onclick="playHuman(${i})">${c.r+c.s}</button>`).join('');if(G.phase==='bid'){$('bidInfo').textContent=`المزايدة — دور اللاعب ${G.bidTurn+1}`;$('bids').innerHTML=[7,8,9,10,11,12,13].map(n=>`<button ${G.bidTurn!==0?'disabled':''} onclick="bid(${n})">${n}</button>`).join('')}$('log').innerHTML=G.log.slice(-10).map(x=>'• '+x).join('<br>')}window.bid=n=>{if(G.bidTurn!==0)return;G.bids[0]=n;G.bidTurn=1;G.log.push(`أنت زايدت ${n}.`);aiBids();render()};function aiBids(){while(G.bidTurn<4){let p=G.bidTurn,n=bestBid(G.players[p]),high=Math.max(6,...G.bids.filter(Boolean));G.bids[p]=n>high?n:null;if(G.bids[p])G.log.push(`اللاعب ${p+1} زايد ${n}.`);else G.log.push(`اللاعب ${p+1} مرّر.`);G.bidTurn++}let w=G.bids.map((v,i)=>({v,i})).filter(x=>x.v).sort((a,b)=>b.v-a.v)[0]||{v:7,i:0};G.bid=w.v;G.current=w.i;G.trump=chooseTrump(G.players[w.i]);G.phase='play';G.log.push(`الحكم ${G.trump} · الطلب ${G.bid}`)}window.playHuman=i=>playCard(0,i);function playCard(p,i){if(G.phase!=='play'||G.current!==p)return;let c=G.players[p].hand[i];if(!legal(c))return message('يجب اتباع النوع نفسه إذا كان لديك منه.');G.players[p].hand.splice(i,1);if(!G.trick.length)G.lead=c.s;G.trick.push({p,c});if(G.trick.length===4)resolve();else G.current=(G.current+1)%4;render();aiLoop()}function resolve(){let w=G.trick.reduce((a,x)=>{if(x.c.s===G.trump&&a.c.s!==G.trump)return x;if(x.c.s!==G.trump&&a.c.s===G.trump)return a;if(x.c.s===a.c.s&&x.c.v>a.c.v)return x;return a},G.trick[0]).p;G.players[w].tricks++;G.current=w;G.trick=[];G.lead=null;G.trickNo++;if(G.trickNo===13){let team=G.bids.indexOf(Math.max(...G.bids))%2,got=G.players.filter(p=>p.team===team).reduce((a,p)=>a+p.tricks,0);G.scores[team]+=got>=G.bid?G.bid+(got-G.bid):-G.bid;G.scores[1-team]+=13-got;if(Math.max(...G.scores)>=31){G.phase='end';G.log.push('انتهت المباراة!')}else{G.round++;deal()}}}function aiLoop(){if(!G?.demo||G.phase==='end')return;if(G.phase==='bid'&&G.bidTurn>0){setTimeout(()=>{aiBids();render();aiLoop()},400)}else if(G.phase==='play'&&G.current!==0){setTimeout(()=>{let h=G.players[G.current].hand,v=h.filter(legal);let c=v.sort((a,b)=>b.v-a.v)[0];playCard(G.current,h.indexOf(c))},500)}}async function backHome(){G=null;show('game',false);let{data:{session}}=await supabase.auth.getSession();session?showHome():(show('landing',true))}window.backHome=backHome;supabase.auth.onAuthStateChange((e,s)=>{if(s&&!G)showHome()});</script></body></html>
