name: Import full Backgammon source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: !contains(github.event.head_commit.message, '[skip backgammon import]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Al-Molook
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clone upstream Backgammon project
        run: git clone --depth 1 https://github.com/quasoft/backgammonjs.git /tmp/backgammonjs

      - name: Copy complete source tree
        run: |
          rm -rf games/vendors/backgammonjs
          mkdir -p games/vendors/backgammonjs
          rsync -a --exclude='.git' --exclude='node_modules' /tmp/backgammonjs/ games/vendors/backgammonjs/

      - name: Record provenance
        run: |
          cat > games/vendors/backgammonjs/IMPORT.md <<'EOF'
          # Backgammon.js import

          This directory contains the complete upstream source tree imported from:
          https://github.com/quasoft/backgammonjs

          Upstream license: MIT.
          The source is preserved as a vendor copy before any adapter integration.
          EOF

      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/vendors/backgammonjs
          git diff --cached --quiet && exit 0
          git commit -m "chore: import complete Backgammon.js source [skip backgammon import]"
          git push
