name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required files
        run: |
          set -euo pipefail
          test -f index.html
          test -f games/registry.js
          test -f games/backgammon/index.js
          test -f games/bullem/index.js
          grep -q "bullem" games/registry.js
          grep -q 'data-game="bullem"' index.html
          test -f wrangler.jsonc

      - name: Prepare deploy assets
        run: |
          set -euo pipefail
          rm -rf .cloudflare-assets
          mkdir -p .cloudflare-assets
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude '.cloudflare-assets' \
            ./ .cloudflare-assets/

      - name: Deploy static assets to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.125.0"
          command: deploy --config wrangler.jsonc
