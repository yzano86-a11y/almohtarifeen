name: Deploy to Cloudflare Workers
# verified deployment trigger

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Node and npm
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run Tarneeb engine tests
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Patch UI navigation compatibility
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const appPath = 'dist/app.js';
          let app = fs.readFileSync(appPath, 'utf8');
          const replacements = [
            ["const $=id=>document.getElementById(id)", "const $=id=>document.getElementById(id)||document.createElement('div')"],
            ["function msg(t){$('msg').textContent=t||''}", "function msg(t){const e=$('msg');if(e)e.textContent=t||''}"]
          ];
          for (const [from,to] of replacements) {
            if (app.includes(from)) app = app.replace(from,to);
          }
          fs.writeFileSync(appPath, app);

          const indexPath = 'dist/index.html';
          let index = fs.readFileSync(indexPath, 'utf8');
          index = index.replace(/(src=["']\.\/app\.js)(["'])/g, '$1?v=20260824-ui-fix$2');
          index = index.replace(/<script\s+src=["']\.\/app\.js(?:\?[^"']*)?["']\s*><\/script>/g, '<script type="module" src="./app.js?v=20260825-module"></script>');
          if (!/<script[^>]+type=["']module["'][^>]+src=["'][^"']*app\.js/i.test(index)) {
            if (index.includes('</body>')) index = index.replace('</body>', '<script type="module" src="./app.js?v=20260825-module"></script></body>');
            else index += '<script type="module" src="./app.js?v=20260825-module"></script>';
          }
          fs.writeFileSync(indexPath, index);
          console.log('Patched UI navigation, module loading, cache-busted app.js, and ensured module script injection.');
          NODE

      - name: Verify deployed entrypoint wiring
        run: |
          set -euo pipefail
          grep -Eo '<script[^>]+type=["'"']module["'"'][^>]+src=["'"'][^"'"']*app\.js[^"'"']*["'"']' dist/index.html
          test -f dist/app.js
          echo "Entrypoint wiring verified: index.html loads dist/app.js as an ES module."

      - name: Normalize Cloudflare credentials
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$RAW_CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }

          TOKEN="$(printf '%s' "$RAW_CLOUDFLARE_API_TOKEN" \
            | tr -d '\r\n' \
            | sed -E 's/^[[:space:]]*["'"'"']?[[:space:]]*Authorization:[[:space:]]*["'"'"']?[[:space:]]*//I' \
            | sed -E 's/^[[:space:]]*(Bearer|Token)[[:space:]]+//I' \
            | sed -E 's/^[[:space:]]*["'"'"']|["'"'"'][[:space:]]*$//g')"

          test -n "$TOKEN" || { echo "Cloudflare API token is empty after normalization"; exit 1; }
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$TOKEN" >> "$GITHUB_ENV"
          printf 'CLOUDFLARE_ACCOUNT_ID=%s\n' "$CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "Cloudflare credentials are configured."

      - name: Deploy static assets to Cloudflare Workers
        run: npx wrangler deploy --config wrangler.jsonc
