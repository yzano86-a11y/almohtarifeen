name: Deploy to Cloudflare Workers
# verified deployment trigger

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Node and npm
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run Tarneeb engine tests
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Patch UI navigation compatibility
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const appPath = 'dist/app.js';
          let app = fs.readFileSync(appPath, 'utf8');
          const replacements = [
            ["const $=id=>document.getElementById(id)", "const $=id=>document.getElementById(id)||document.createElement('div')"],
            ["function msg(t){$('msg').textContent=t||''}", "function msg(t){const e=$('msg');if(e)e.textContent=t||''}"]
          ];
          for (const [from,to] of replacements) {
            if (app.includes(from)) app = app.replace(from,to);
          }
          fs.writeFileSync(appPath, app);

          const cssPath = 'dist/reference-layout.css';
          let css = fs.readFileSync(cssPath, 'utf8');
          const runtimeOverride = `\n/* Runtime visibility guard: .hidden must win over the reference canvas !important rules. */\nbody.reference-layout #approvedHome.hidden,body.reference-layout #auth.hidden,body.reference-layout #landing.hidden,body.reference-layout #home.hidden,body.reference-layout #room.hidden,body.reference-layout #socialHub.hidden,body.reference-layout #game.hidden{display:none!important}\nbody.reference-layout #game:not(.hidden){display:block!important;position:relative!important;width:100%!important;height:auto!important;min-height:100%!important;overflow:auto!important}\nbody.reference-layout.game-active #approvedHome,body.reference-layout.game-active #auth{display:none!important}\n`;
          if (!css.includes('Runtime visibility guard')) css += runtimeOverride;
          fs.writeFileSync(cssPath, css);

          const indexPath = 'dist/index.html';
          let index = fs.readFileSync(indexPath, 'utf8');
          index = index.replace(/<script\s+src=["']\.\/app\.js(?:\?[^"']*)?["']\s*><\/script>/g, '<script type="module" src="./app.js?v=20260825-module"></script>');
          if (!index.includes('type="module" src="./app.js')) {
            const tag = '<script type="module" src="./app.js?v=20260825-module"></script>';
            index = index.includes('</body>') ? index.replace('</body>', tag + '</body>') : index + tag;
          }
          const bootTag = '<script type="module" src="./boot.js?v=20260825-boot"></script>';
          if (!index.includes('src="./boot.js')) {
            index = index.includes('</body>') ? index.replace('</body>', bootTag + '</body>') : index + bootTag;
          }
          fs.writeFileSync(indexPath, index);
          fs.copyFileSync('boot.js','dist/boot.js');
          console.log('Patched module loading, cache-busted app.js, runtime visibility guard, and guest game boot bridge.');
          NODE

      - name: Verify deployed entrypoint wiring and game shell
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('dist/index.html', 'utf8');
          const css = fs.readFileSync('dist/reference-layout.css', 'utf8');
          const app = fs.readFileSync('dist/app.js', 'utf8');
          const boot = fs.readFileSync('dist/boot.js', 'utf8');
          const engine = fs.readFileSync('dist/games/tarneeb/engine.js', 'utf8');
          const hasModuleApp = /<script\b[^>]*type=["']module["'][^>]*src=["'][^"']*app\.js[^"']*["'][^>]*>/i.test(html);
          const hasBoot = /<script\b[^>]*type=["']module["'][^>]*src=["'][^"']*boot\.js[^"']*["'][^>]*>/i.test(html);
          const required = [
            ['dist/app.js', app],
            ['dist/boot.js', boot],
            ['dist/games/tarneeb/engine.js', engine]
          ];
          if (!hasModuleApp || !hasBoot) throw new Error('Entrypoint module wiring is incomplete.');
          for (const [name,text] of required) if (!text) throw new Error(`${name} is empty or missing.`);
          if (!app.includes('window.guestPlay') || !app.includes("import('./games/tarneeb/engine.js')")) throw new Error('guestPlay/startGame/engine import wiring is incomplete.');
          if (!boot.includes('ensureAppLoaded') || !boot.includes('revealGameShell')) throw new Error('Guest boot bridge is incomplete.');
          if (!engine.includes('dealHands') || !engine.includes('newState') || !engine.includes('applyBid') || !engine.includes('setTrump') || !engine.includes('applyCard')) throw new Error('Tarneeb engine runtime functions are missing.');
          if (!css.includes('Runtime visibility guard') || !css.includes('#approvedHome.hidden') || !css.includes('#game:not(.hidden)')) throw new Error('Runtime game visibility guard is missing.');
          console.log('Full runtime verification passed: entrypoint, boot bridge, game shell, CSS visibility, and Tarneeb engine are present.');
          NODE

      - name: Normalize Cloudflare credentials
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$RAW_CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
          TOKEN="$(printf '%s' "$RAW_CLOUDFLARE_API_TOKEN" | tr -d '\r\n' | sed -E 's/^[[:space:]]*["'"'"']?[[:space:]]*Authorization:[[:space:]]*["'"'"']?[[:space:]]*//I' | sed -E 's/^[[:space:]]*(Bearer|Token)[[:space:]]+//I' | sed -E 's/^[[:space:]]*["'"'"']|["'"'"'][[:space:]]*$//g')"
          test -n "$TOKEN" || { echo "Cloudflare API token is empty after normalization"; exit 1; }
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$TOKEN" >> "$GITHUB_ENV"
          printf 'CLOUDFLARE_ACCOUNT_ID=%s\n' "$CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "Cloudflare credentials are configured."

      - name: Deploy static assets to Cloudflare Workers
        run: npx wrangler deploy --config wrangler.jsonc
