name: Deploy to Cloudflare Workers
# verified deployment trigger

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Node and npm
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run Tarneeb engine tests
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Patch UI navigation compatibility
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const appPath = 'dist/app.js';
          let app = fs.readFileSync(appPath, 'utf8');
          const replacements = [
            ["const $=id=>document.getElementById(id)", "const $=id=>document.getElementById(id)||document.createElement('div')"],
            ["function msg(t){$('msg').textContent=t||''}", "function msg(t){const e=$('msg');if(e)e.textContent=t||''}"]
          ];
          for (const [from,to] of replacements) {
            if (app.includes(from)) app = app.replace(from,to);
          }
          fs.writeFileSync(appPath, app);

          const cssPath = 'dist/reference-layout.css';
          let css = fs.readFileSync(cssPath, 'utf8');
          const runtimeOverride = `\n/* Runtime visibility guard: the reference canvas must not override the game state. */\nbody.reference-layout #approvedHome.hidden,body.reference-layout #auth.hidden,body.reference-layout #landing.hidden,body.reference-layout #home.hidden,body.reference-layout #room.hidden,body.reference-layout #socialHub.hidden,body.reference-layout #game.hidden{display:none!important}\nbody.reference-layout.game-active #approvedHome,body.reference-layout.game-active #auth{display:none!important}\nbody.reference-layout.game-active #game:not(.hidden){display:block!important;position:absolute!important;inset:0!important;width:100%!important;height:100%!important;min-height:100%!important;max-height:none!important;overflow:auto!important;z-index:200!important;border-radius:0!important;margin:0!important}\n`;
          if (!css.includes('reference canvas must not override the game state')) css += runtimeOverride;
          fs.writeFileSync(cssPath, css);

          const indexPath = 'dist/index.html';
          let index = fs.readFileSync(indexPath, 'utf8');
          index = index.replace(/<script\s+src=["']\.\/app\.js(?:\?[^"']*)?["']\s*><\/script>/g, '<script type="module" src="./app.js?v=20260825-module"></script>');
          if (!index.includes('type="module" src="./app.js')) {
            const tag = '<script type="module" src="./app.js?v=20260825-module"></script>';
            index = index.includes('</body>') ? index.replace('</body>', tag + '</body>') : index + tag;
          }
          const bootTag = '<script type="module" src="./boot.js?v=20260825-boot"></script>';
          if (!index.includes('src="./boot.js')) {
            index = index.includes('</body>') ? index.replace('</body>', bootTag + '</body>') : index + bootTag;
          }

          // Browser-direct guest launcher: do not depend on the module boot bridge or inline guestPlay being ready.
          const directBoot = `<script>window.__launchGuest=async function(e){try{if(e){e.preventDefault();e.stopPropagation();}const hide=['approvedHome','landing','home','room','socialHub','auth'];for(const id of hide){const el=document.getElementById(id);if(el)el.classList.add('hidden');}const game=document.getElementById('game');if(game)game.classList.remove('hidden');document.body.classList.add('game-active');const state=document.getElementById('stateInfo');if(state)state.textContent='جاري فتح طاولة طرنيب…';if(typeof window.guestPlay!=='function')await import('./app.js?v=20260825-directboot');if(typeof window.guestPlay!=='function')throw new Error('تعذر تحميل تشغيل اللعبة.');await window.guestPlay();}catch(err){console.error('Direct guest launch failed',err);const state=document.getElementById('stateInfo');if(state)state.textContent=err?.message||'تعذر فتح طاولة طرنيب';const log=document.getElementById('log');if(log)log.textContent='خطأ تشغيل اللعبة: '+(err?.message||err);}}</script>`;
          if (!index.includes('window.__launchGuest')) index = index.includes('</body>') ? index.replace('</body>', directBoot + '</body>') : index + directBoot;
          index = index.replace(/onclick=["']backLanding\(\);guestPlay\(\)["']/g, 'onclick="__launchGuest(event)"');
          index = index.replace(/onclick=["']guestPlay\(\)["']/g, 'onclick="__launchGuest(event)"');
          fs.writeFileSync(indexPath, index);
          fs.copyFileSync('boot.js','dist/boot.js');

          // The UI click bridge is part of the runtime surface and must be deployed with the app.
          fs.copyFileSync('ui-click-bridge.js','dist/ui-click-bridge.js');
          const bridgeTag = '<script src="./ui-click-bridge.js?v=20260826-bridge"></script>';
          if (!index.includes('src="./ui-click-bridge.js')) {
            index = index.includes('</body>') ? index.replace('</body>', bridgeTag + '</body>') : index + bridgeTag;
          }
          fs.writeFileSync(indexPath, index);

          // social-ui.js is loaded dynamically by app.js and therefore must also be present in dist.
          fs.copyFileSync('social-ui.js','dist/social-ui.js');

          // Prevent a stale HTML shell from hiding the new launcher after deployment.
          fs.writeFileSync('dist/_headers', `/\n  Cache-Control: no-store\n/index.html\n  Cache-Control: no-store\n`);
          console.log('Patched module loading, direct browser guest launcher, game takeover visibility, boot bridge, UI click bridge, social runtime, and HTML cache policy.');
          NODE

      - name: Verify deployed entrypoint wiring and game shell
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('dist/index.html', 'utf8');
          const css = fs.readFileSync('dist/reference-layout.css', 'utf8');
          const app = fs.readFileSync('dist/app.js', 'utf8');
          const boot = fs.readFileSync('dist/boot.js', 'utf8');
          const bridge = fs.readFileSync('dist/ui-click-bridge.js', 'utf8');
          const social = fs.readFileSync('dist/social-ui.js', 'utf8');
          const engine = fs.readFileSync('dist/games/tarneeb/engine.js', 'utf8');
          const headers = fs.readFileSync('dist/_headers', 'utf8');
          const hasModuleApp = /<script\b[^>]*type=["']module["'][^>]*src=["'][^"']*app\.js[^"']*["'][^>]*>/i.test(html);
          const hasBoot = /<script\b[^>]*type=["']module["'][^>]*src=["'][^"']*boot\.js[^"']*["'][^>]*>/i.test(html);
          const hasBridge = /<script\b[^>]*src=["'][^"']*ui-click-bridge\.js[^"']*["'][^>]*>/i.test(html);
          const required = [
            ['dist/app.js', app],
            ['dist/boot.js', boot],
            ['dist/ui-click-bridge.js', bridge],
            ['dist/social-ui.js', social],
            ['dist/games/tarneeb/engine.js', engine]
          ];
          if (!hasModuleApp || !hasBoot || !hasBridge) throw new Error('Entrypoint module wiring is incomplete.');
          for (const [name,text] of required) if (!text) throw new Error(`${name} is empty or missing.`);
          if (!html.includes('window.__launchGuest') || !html.includes('onclick="__launchGuest(event)"')) throw new Error('Direct browser guest launcher wiring is incomplete.');
          if (!app.includes('window.guestPlay') || !app.includes("import('./games/tarneeb/engine.js')")) throw new Error('guestPlay/startGame/engine import wiring is incomplete.');
          if (!boot.includes('ensureAppLoaded') || !boot.includes('revealGameShell')) throw new Error('Guest boot bridge is incomplete.');
          if (!bridge.includes('window.guestPlay') || !bridge.includes('missing handler')) throw new Error('UI click bridge is incomplete.');
          if (!app.includes("import('./social-ui.js")) throw new Error('social-ui runtime import is missing.');
          if (!engine.includes('dealHands') || !engine.includes('newState') || !engine.includes('applyBid') || !engine.includes('setTrump') || !engine.includes('applyCard')) throw new Error('Tarneeb engine runtime functions are missing.');
          if (!css.includes('reference canvas must not override the game state') || !css.includes('#approvedHome.hidden') || !css.includes('game-active #game:not(.hidden)') || !css.includes('z-index:200')) throw new Error('Game takeover visibility guard is missing.');
          if (!headers.includes('Cache-Control: no-store')) throw new Error('HTML cache policy is missing.');
          console.log('Full runtime verification passed: direct launcher, entrypoint, boot bridge, UI bridge, social runtime, game shell, CSS game takeover, Tarneeb engine, and cache policy.');
          NODE

      - name: Normalize Cloudflare credentials
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$RAW_CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
          TOKEN="$(printf '%s' "$RAW_CLOUDFLARE_API_TOKEN" | tr -d '\r\n' | sed -E 's/^[[:space:]]*["'"'"']?[[:space:]]*Authorization:[[:space:]]*["'"'"']?[[:space:]]*//I' | sed -E 's/^[[:space:]]*(Bearer|Token)[[:space:]]+//I' | sed -E 's/^[[:space:]]*["'"'"']|["'"'"'][[:space:]]*$//g')"
          test -n "$TOKEN" || { echo "Cloudflare API token is empty after normalization"; exit 1; }
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$TOKEN" >> "$GITHUB_ENV"
          printf 'CLOUDFLARE_ACCOUNT_ID=%s\n' "$CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "Cloudflare credentials are configured."

      - name: Install browser smoke-test runtime
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium

      - name: Deploy static assets to Cloudflare Workers
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Run real browser guest-play smoke test
        env:
          LIVE_APP_URL: https://almohtarifeen.yzano86.workers.dev/
        run: node tests/live_guest_smoke.mjs
