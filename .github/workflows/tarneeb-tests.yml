name: Tarneeb Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  tarneeb-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Tarneeb test suite
        run: |
          node --version
          if [ -f package.json ]; then
            npm install --ignore-scripts
            npm test --if-present
          fi
          if [ -f tarneeb_engine.test.mjs ]; then
            node tarneeb_engine.test.mjs
          elif [ -f tests/tarneeb_engine.test.mjs ]; then
            node tests/tarneeb_engine.test.mjs
          else
            echo 'Tarneeb test file not found; repository test suite must provide it.'
            exit 1
          fi
