name: Tarneeb Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tarneeb-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tarneeb-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run dependency-free Tarneeb acceptance suite
        run: node tests/tarneeb_engine.test.mjs
