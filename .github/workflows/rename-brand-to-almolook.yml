name: Rename brand to الملوك

on:
  push:
    paths:
      - '.github/workflows/rename-brand-to-almolook.yml'

permissions:
  contents: write

jobs:
  rename-brand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace visible brand name
        shell: bash
        run: |
          set -euo pipefail
          grep -RIl --exclude-dir=.git --exclude-dir=node_modules --exclude='*.lock' 'المحترفين' . | while IFS= read -r file; do
            python - "$file" <<'PY'
import sys
from pathlib import Path
p = Path(sys.argv[1])
try:
    s = p.read_text(encoding='utf-8')
except UnicodeDecodeError:
    raise SystemExit(0)
new = s.replace('المحترفين', 'الملوك')
if new != s:
    p.write_text(new, encoding='utf-8')
PY
          done

      - name: Commit brand rename
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No brand changes found.'
            exit 0
          fi
          git commit -m 'feat: rename app brand from المحترفين to الملوك'
          git push
