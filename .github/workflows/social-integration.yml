name: Social UI Integration

on:
  push:
    branches: [main, fix/social-ui-wiring-verified]
    paths:
      - 'index.html'
      - 'social-ui.js'
      - 'chat-ui.js'
      - 'games/**'
      - 'tests/social-ui-wiring.test.mjs'
      - '.github/workflows/social-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify social UI and game entrypoint
        run: node --test tests/social-ui-wiring.test.mjs
