name: Audit Bull Em

on:
  workflow_dispatch:
  push:
    branches: [independent-project-audit]

jobs:
  bullem:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Bull Em
        uses: actions/checkout@v4
        with:
          repository: jvmarten/bullem
          ref: main
          path: bullem

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bullem/package-lock.json

      - name: Install dependencies
        working-directory: bullem
        run: npm ci

      - name: Build
        working-directory: bullem
        run: npm run build

      - name: Test shared
        working-directory: bullem
        run: npm test -w shared

      - name: Test server
        working-directory: bullem
        run: npm test -w server

      - name: Test client
        working-directory: bullem
        run: npm test -w client
